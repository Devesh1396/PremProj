# PostgreSQL for the Prem Health Intelligence system.
#
# n8n is NOT defined here. It already runs on this VPS in its own Docker
# stack (Hostinger n8n template). This compose file adds only the database
# and joins it to the network n8n is already on.
#
# Find that network:
#   docker inspect <n8n-container> -f '{{json .NetworkSettings.Networks}}' | python3 -m json.tool
# then set N8N_NETWORK in .env.
#
# Deliberately NO published port. Postgres is reachable only from
# containers on the shared Docker network, by the hostname `phi-postgres`.
# Nothing on the public internet can reach it, and neither can other
# processes on the host unless they join the network. This database holds
# personal health information.

name: phi

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: phi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"

    # No `ports:` block. This is intentional. To reach the database from
    # the host for migrations or psql, exec into the container:
    #   docker exec -it phi-postgres psql -U phi_admin -d phi

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./backups:/backups

    # Tuned for a 2 vCPU / 8 GB VPS shared with n8n. CPU is the binding
    # constraint here, not memory: keep Wave-1 batch concurrency at 2-3.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=60
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      # Log slow queries only. Never log statement text: engine payloads
      # and client data must not land in ordinary logs.
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_statement=none

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 4G

    networks:
      - n8n_shared

volumes:
  postgres_data:

networks:
  n8n_shared:
    external: true
    name: ${N8N_NETWORK}
